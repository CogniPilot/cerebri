#
# CUBS2 deployment profile.
#
# native_sim deployment controller:
#   Zenoh/csyn mocap + manual_control -> controller -> Zenoh/csyn control_output.
# Joystick input and Arduino PPM output are separate Zenoh nodes.

CONFIG_CUBS2_SITL=n
CONFIG_CUBS2_HOST_DEPLOY_IO=y
CONFIG_CUBS2_HOST_DEPLOY_JOYSTICK=n
CONFIG_CUBS2_SERIAL_BRIDGE_INTERNAL=y
CONFIG_CUBS2_SERIAL_BRIDGE_CSYN_OUTPUT=y
CONFIG_CUBS2_PPM_MANUAL_OVERRIDE=y
